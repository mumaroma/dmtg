<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 5: 5개 운동 관찰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    padding: 12px;
    color: #fff;
  }
  @media (min-width: 768px) { body { padding: 32px; } }
  .container { max-width: 1280px; margin: 0 auto; }
  h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }
  @media (min-width: 768px) { h1 { font-size: 1.875rem; margin-bottom: 24px; } }

  .controls { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  @media (min-width: 768px) { .controls { gap: 16px; margin-bottom: 24px; } }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border: none; border-radius: 8px;
    color: #fff; font-size: .875rem; cursor: pointer; transition: background .2s;
  }
  @media (min-width: 768px) { .btn { padding: 12px 24px; font-size: 1rem; } }
  .btn svg { width: 18px; height: 18px; }
  .btn-start { background: #3b82f6; }
  .btn-start:hover { background: #2563eb; }
  .btn-start:disabled { background: #6b7280; cursor: not-allowed; }
  .btn-reset { background: #4b5563; }
  .btn-reset:hover { background: #374151; }
  .timer {
    display: flex; align-items: center; padding: 0 12px;
    background: #334155; border-radius: 8px; font-weight: 700; font-size: 1rem;
  }
  @media (min-width: 768px) { .timer { padding: 0 16px; font-size: 1.125rem; } }

  .legend { background: #334155; border-radius: 8px; padding: 12px; margin-bottom: 16px;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  @media (min-width: 768px) { .legend { padding: 16px; margin-bottom: 24px; grid-template-columns: repeat(5, 1fr); gap: 16px; } }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: .75rem; }
  @media (min-width: 768px) { .legend-item { font-size: .875rem; } }
  .legend-item .dot { width: 16px; height: 16px; border-radius: 50%; }

  .graphs { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 1024px) { .graphs { grid-template-columns: 1fr 1fr; gap: 24px; } }
  .panel { background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); }
  @media (min-width: 768px) { .panel { padding: 24px; } }
  .panel h2 { color: #1f2937; font-size: 1.125rem; font-weight: 700; margin-bottom: 12px; }
  @media (min-width: 768px) { .panel h2 { font-size: 1.25rem; margin-bottom: 16px; } }
  .svg-wrap { overflow-x: auto; }
  .svg-wrap svg { width: 100%; display: block; border: 2px solid #d1d5db; border-radius: 4px; }

  .note { margin-top: 16px; background: rgba(30, 58, 138, .5); border-radius: 8px; padding: 12px; font-size: .75rem; }
  @media (min-width: 768px) { .note { margin-top: 24px; padding: 16px; font-size: .875rem; } }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

  .tick-sm { font-size: 14px; fill: #374151; }
  .tick-xs { font-size: 12px; fill: #4b5563; }
  .bold { font-weight: 700; }
  .label { font-size: 14px; font-weight: 700; }
  .axis-label { font-size: 14px; fill: #374151; font-weight: 600; }
  .home-link { position: fixed; top: 10px; left: 10px; z-index: 50; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; font-weight: 600; text-decoration: none; backdrop-filter: blur(4px); }
  .home-link:hover { background: rgba(0,0,0,.65); }
</style>
</head>
<body>
<a class="home-link" href="../index.html">← 활동 목록</a>
<div class="container">
  <h1>활동 5: 5개 운동 관찰</h1>

  <div class="controls">
    <button id="startBtn" class="btn btn-start">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      시작
    </button>
    <button id="resetBtn" class="btn btn-reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
      리셋
    </button>
    <div class="timer"><span id="timeDisplay">0.0초</span></div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="graphs">
    <div class="panel">
      <h2>운동 자취</h2>
      <div class="svg-wrap"><svg id="svgTrace" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
    <div class="panel">
      <h2>시간-위치 그래프</h2>
      <div class="svg-wrap"><svg id="svgGraph" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>

  <div class="note">💡 <strong>안내:</strong> 5개의 서로 다른 운동을 관찰하세요. 0점이 빨간색으로 표시되며, 2단위 간격으로 눈금이 표시됩니다.</div>
</div>

<script>
(function () {
  // ===== 설정 =====
  const startPos = -10, endPos = 20, maxTime = 10;
  const MS_PER_SEC = 500; // 실제 500ms = 시뮬레이션 1초 (2배속)

  // 5개 운동 (모두 0m 출발). traceColor: 자취 색, graphColor: 그래프 색
  const motions = [
    { slope: 1,    intercept: 0, traceColor: '#ef4444', graphColor: '#10b981', name: '운동 1', label: '1' },
    { slope: 0.5,  intercept: 0, traceColor: '#f97316', graphColor: '#1e3a8a', name: '운동 2', label: '2' },
    { slope: 2,    intercept: 0, traceColor: '#eab308', graphColor: '#000000', name: '운동 3', label: '3' },
    { slope: -0.8, intercept: 0, traceColor: '#3b82f6', graphColor: '#ec4899', name: '운동 4', label: '4' },
    { slope: 0,    intercept: 0, traceColor: '#8b5cf6', graphColor: '#6b7280', name: '운동 5', label: '5' },
  ];
  const N = motions.length;
  const getPosition = (i, t) => motions[i].slope * t + motions[i].intercept;

  const posToX = pos => 50 + ((pos - startPos) / (endPos - startPos)) * 400;          // 자취 그래프
  const tToGX  = t   => 50 + t * 40;                                                   // 시간-위치 그래프 x
  const posToGY = pos => 450 - ((pos - startPos) / (endPos - startPos)) * 400;         // 시간-위치 그래프 y

  // ===== 상태 =====
  let isPlaying = false;
  let time = 0;
  let traces = motions.map(() => [{ time: 0, pos: 0 }]);
  let rafId = null, startTimestamp = 0, lastTraceSec = 0;

  // ===== DOM =====
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const svgTrace = document.getElementById('svgTrace');
  const svgGraph = document.getElementById('svgGraph');

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // 범례
  const legend = document.getElementById('legend');
  motions.forEach(m => {
    const d = document.createElement('div');
    d.className = 'legend-item';
    d.innerHTML = '<span class="dot" style="background:' + m.traceColor + '"></span><span>' + m.name + '</span>';
    legend.appendChild(d);
  });

  // ----- 자취 그래프 정적 요소 -----
  svgTrace.appendChild(el('line', { x1: 50, y1: 250, x2: 450, y2: 250, stroke: '#374151', 'stroke-width': 4 }));
  for (let v = startPos; v <= endPos; v += 2) {
    const x = posToX(v);
    svgTrace.appendChild(el('line', { x1: x, y1: 240, x2: x, y2: 260, stroke: '#374151', 'stroke-width': 2 }));
    svgTrace.appendChild(el('text', { x, y: 280, 'text-anchor': 'middle', class: 'tick-sm' + (v === 0 ? ' bold' : '') }, v));
    if (v === 0) {
      svgTrace.appendChild(el('line', { x1: x, y1: 100, x2: x, y2: 400, stroke: '#ef4444', 'stroke-width': 2, 'stroke-dasharray': '5,5', opacity: 0.3 }));
      svgTrace.appendChild(el('circle', { cx: x, cy: 250, r: 6, fill: '#ef4444' }));
    }
  }
  const traceGroups = motions.map((m, i) => {
    const y = 100 + i * 60;
    svgTrace.appendChild(el('text', { x: 20, y: y + 5, 'text-anchor': 'middle', class: 'label', fill: m.traceColor }, m.label));
    const g = el('g', {}); svgTrace.appendChild(g); return g;
  });

  // ----- 시간-위치 그래프 정적 요소 -----
  svgGraph.appendChild(el('line', { x1: 50, y1: 450, x2: 450, y2: 450, stroke: '#374151', 'stroke-width': 2 }));
  svgGraph.appendChild(el('line', { x1: 50, y1: 50, x2: 50, y2: 450, stroke: '#374151', 'stroke-width': 2 }));
  for (let v = endPos; v >= startPos; v -= 2) {
    const y = posToGY(v);
    svgGraph.appendChild(el('line', { x1: 50, y1: y, x2: 450, y2: y, stroke: '#e5e7eb', 'stroke-width': 1 }));
    svgGraph.appendChild(el('text', { x: 35, y: y + 5, 'text-anchor': 'end', class: 'tick-xs' + (v === 0 ? ' bold' : '') }, v));
    if (v === 0) {
      svgGraph.appendChild(el('line', { x1: 50, y1: y, x2: 450, y2: y, stroke: '#ef4444', 'stroke-width': 2, opacity: 0.3 }));
      svgGraph.appendChild(el('circle', { cx: 50, cy: y, r: 6, fill: '#ef4444' }));
    }
  }
  for (let i = 0; i <= 10; i++) {
    const x = tToGX(i);
    svgGraph.appendChild(el('line', { x1: x, y1: 50, x2: x, y2: 450, stroke: '#e5e7eb', 'stroke-width': 1 }));
    svgGraph.appendChild(el('text', { x, y: 470, 'text-anchor': 'middle', class: 'tick-xs' }, i));
  }
  svgGraph.appendChild(el('text', { x: 250, y: 490, 'text-anchor': 'middle', class: 'axis-label' }, '시간 (초)'));
  svgGraph.appendChild(el('text', { x: 20, y: 250, 'text-anchor': 'middle', class: 'axis-label', transform: 'rotate(-90 20 250)' }, '위치 (m)'));
  const graphGroups = motions.map(() => { const g = el('g', {}); svgGraph.appendChild(g); return g; });

  // ===== 렌더링 =====
  function clear(g) { while (g.firstChild) g.removeChild(g.firstChild); }

  function render() {
    timeDisplay.textContent = time.toFixed(1) + '초';
    startBtn.disabled = isPlaying || time >= maxTime;

    for (let i = 0; i < N; i++) {
      const m = motions[i], tr = traces[i];
      // 자취
      const y = 100 + i * 60;
      const g = traceGroups[i]; clear(g);
      tr.forEach(p => g.appendChild(el('circle', { cx: posToX(p.pos), cy: y, r: 5, fill: m.traceColor, opacity: 0.7 })));
      g.appendChild(el('circle', { cx: posToX(getPosition(i, time)), cy: y, r: 10, fill: m.traceColor, class: 'pulse' }));
      // 시간-위치 그래프
      const gg = graphGroups[i]; clear(gg);
      for (let k = 1; k < tr.length; k++) {
        gg.appendChild(el('line', {
          x1: tToGX(tr[k - 1].time), y1: posToGY(tr[k - 1].pos),
          x2: tToGX(tr[k].time),     y2: posToGY(tr[k].pos),
          stroke: m.graphColor, 'stroke-width': 3
        }));
      }
      tr.forEach(p => gg.appendChild(el('circle', { cx: tToGX(p.time), cy: posToGY(p.pos), r: 5, fill: m.graphColor })));
      gg.appendChild(el('circle', { cx: tToGX(time), cy: posToGY(getPosition(i, time)), r: 8, fill: m.graphColor, class: 'pulse' }));
    }
  }

  // ===== 애니메이션 =====
  function animate(ts) {
    if (!startTimestamp) startTimestamp = ts;
    const t = Math.min((ts - startTimestamp) / MS_PER_SEC, maxTime);
    time = t;
    const sec = Math.floor(t);
    if (sec > lastTraceSec && sec <= maxTime) {
      lastTraceSec = sec;
      for (let i = 0; i < N; i++) traces[i].push({ time: sec, pos: getPosition(i, sec) });
    }
    render();
    if (t >= maxTime) { isPlaying = false; rafId = null; render(); return; }
    rafId = requestAnimationFrame(animate);
  }

  function start() {
    if (isPlaying || time >= maxTime) return;
    isPlaying = true;
    startTimestamp = 0;
    rafId = requestAnimationFrame(animate);
    render();
  }

  function reset() {
    isPlaying = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    time = 0; startTimestamp = 0; lastTraceSec = 0;
    traces = motions.map(() => [{ time: 0, pos: 0 }]);
    render();
  }

  startBtn.addEventListener('click', start);
  resetBtn.addEventListener('click', reset);
  render();
})();
</script>
</body>
</html>
