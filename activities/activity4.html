<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 4: 물체의 운동 관찰</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #7c2d12 0%, #7f1d1d 50%, #831843 100%);
    padding: 16px;
    color: #fff;
  }
  @media (min-width: 768px) { body { padding: 32px; } }
  .container { max-width: 1024px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 8px; }
  @media (min-width: 768px) { .header h1 { font-size: 2.25rem; } }
  .header p { font-size: 1.125rem; color: #fed7aa; }

  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .interval-box {
    background: rgba(255,255,255,.2); backdrop-filter: blur(4px);
    border-radius: 12px; padding: 16px; max-width: 672px; margin: 0 auto 16px;
  }
  .interval-box h3 { text-align: center; font-weight: 700; margin-bottom: 12px; }
  .int-btn {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; color: #1f2937; background: rgba(255,255,255,.5); transition: all .2s;
  }
  .int-btn:hover { background: rgba(255,255,255,.7); }
  .int-btn.active { background: #eab308; color: #fff; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); }

  .controls { margin-bottom: 24px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 32px; border: none; border-radius: 12px;
    color: #fff; font-size: 1.125rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
    transition: background .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 24px; height: 24px; }
  .btn-play { background: #22c55e; }
  .btn-play:hover { background: #16a34a; }
  .btn-play:disabled { background: #6b7280; cursor: not-allowed; }
  .btn-reset { background: #f97316; }
  .btn-reset:hover { background: #ea580c; }
  .timer-wrap { display: flex; justify-content: center; }
  .timer {
    min-width: 140px; padding: 16px 24px; text-align: center;
    font-size: 1.875rem; font-weight: 700;
    background: rgba(194, 65, 12, .8); border-radius: 12px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
  }

  .panel {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
  }
  @media (min-width: 768px) { .panel { padding: 24px; } }
  .panel h2 { color: #1f2937; font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
  @media (min-width: 768px) { .panel h2 { font-size: 1.5rem; margin-bottom: 16px; } }
  .svg-wrap { overflow-x: auto; }
  .svg-wrap svg { width: 100%; display: block; border: 4px solid #d1d5db; border-radius: 12px; }

  /* 표 */
  .table-card {
    margin: 24px auto 0; max-width: 672px;
    background: #fff; border-radius: 12px; padding: 16px; color: #1f2937;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
  }
  .table-card h3 { font-size: 1.125rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .table-card h3 .dot { width: 16px; height: 16px; border-radius: 50%; background: #f97316; }
  .table-scroll { overflow-y: auto; max-height: 384px; }
  table { width: 100%; font-size: .875rem; border-collapse: collapse; }
  th, td { padding: 8px 12px; text-align: center; }
  thead th { position: sticky; top: 0; font-weight: 700; background: #ffedd5; border: 1px solid #fdba74; }
  td { border: 1px solid #fed7aa; }
  tbody tr:hover { background: #fff7ed; }
  tbody tr.current { background: #fed7aa; font-weight: 700; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

  .tick-text { font-size: 14px; fill: #374151; font-weight: 700; }
  .zero-text { font-size: 20px; fill: #111827; font-weight: 700; }
  .unit-text { font-size: 14px; fill: #4b5563; font-weight: 600; }
  .home-link { position: fixed; top: 10px; left: 10px; z-index: 50; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; font-weight: 600; text-decoration: none; backdrop-filter: blur(4px); }
  .home-link:hover { background: rgba(0,0,0,.65); }
</style>
</head>
<body>
<a class="home-link" href="../index.html">← 활동 목록</a>
<div class="container">
  <div class="header">
    <h1>활동 4: 물체의 운동 관찰</h1>
    <p>물체의 운동을 관찰해보세요</p>
  </div>

  <div class="interval-box">
    <h3>자취 시간 간격 설정</h3>
    <div class="row" id="intervalRow">
      <button class="int-btn" data-interval="0.2">0.2초</button>
      <button class="int-btn" data-interval="0.5">0.5초</button>
      <button class="int-btn active" data-interval="1">1초</button>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="playBtn" class="btn btn-play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
        <span id="playLabel">시작</span>
      </button>
      <button id="resetBtn" class="btn btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        다시하기
      </button>
    </div>
    <div class="timer-wrap"><div class="timer"><span id="timeDisplay">0.0초</span></div></div>
  </div>

  <div class="panel">
    <h2>동적 운동 자취 그래프 (DMTG)</h2>
    <div class="svg-wrap"><svg id="svg" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>

  <div class="table-card">
    <h3><span class="dot"></span>시간과 위치</h3>
    <div class="table-scroll">
      <table>
        <thead><tr><th>시간 (초)</th><th>위치 (m)</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
(function () {
  // ===== 설정 =====
  const startPos = -2, endPos = 18, maxTime = 8;
  const SPEED = 2;          // 실제 1초당 시뮬레이션 2초 진행
  const COLOR = '#f59e0b';

  // 복합 운동: 0~4초 속력 2 m/s, 4~8초 속력 1 m/s
  const getPosition = t => (t <= 4) ? 2 * t : 8 + (t - 4);
  const toX = pos => 50 + ((pos - startPos) / (endPos - startPos)) * 600;

  // ===== 상태 =====
  let isPlaying = false;
  let smoothTime = 0;
  let traceInterval = 1;
  let traces = [{ time: 0, pos: 0 }];
  let rafId = null;

  // ===== DOM =====
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const playLabel = document.getElementById('playLabel');
  const resetBtn = document.getElementById('resetBtn');
  const timeDisplay = document.getElementById('timeDisplay');
  const svg = document.getElementById('svg');
  const tbody = document.getElementById('tbody');

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  // 축 (정적)
  const Y = 150;
  svg.appendChild(el('line', { x1: 50, y1: Y, x2: 650, y2: Y, stroke: '#374151', 'stroke-width': 5 }));
  for (let v = Math.ceil(startPos); v <= endPos; v++) {
    if (v === 0) continue;
    const x = toX(v);
    svg.appendChild(el('line', { x1: x, y1: Y - 10, x2: x, y2: Y + 10, stroke: '#374151', 'stroke-width': 2 }));
    svg.appendChild(el('text', { x, y: Y + 30, 'text-anchor': 'middle', class: 'tick-text' }, v));
  }
  if (startPos <= 0 && endPos >= 0) {
    const x0 = toX(0);
    svg.appendChild(el('line', { x1: x0, y1: Y - 15, x2: x0, y2: Y + 15, stroke: '#374151', 'stroke-width': 5 }));
    svg.appendChild(el('text', { x: x0, y: Y + 50, 'text-anchor': 'middle', class: 'zero-text' }, '0'));
  }
  svg.appendChild(el('text', { x: 350, y: 230, 'text-anchor': 'middle', class: 'unit-text' }, '위치 (m)'));
  const dyn = el('g', {});
  svg.appendChild(dyn);

  // ===== 렌더링 =====
  function render() {
    timeDisplay.textContent = smoothTime.toFixed(1) + '초';
    playBtn.disabled = smoothTime >= maxTime;
    playIcon.style.display = isPlaying ? 'none' : '';
    pauseIcon.style.display = isPlaying ? '' : 'none';
    playLabel.textContent = isPlaying ? '일시정지' : '시작';

    while (dyn.firstChild) dyn.removeChild(dyn.firstChild);
    traces.forEach(tr => {
      const x = toX(tr.pos);
      if (x < 50 || x > 650) return;
      dyn.appendChild(el('circle', { cx: x, cy: Y, r: 7, fill: COLOR, opacity: 0.7 }));
    });
    const cur = getPosition(smoothTime);
    if (cur >= startPos && cur <= endPos) {
      dyn.appendChild(el('circle', { cx: toX(cur), cy: Y, r: 14, fill: COLOR, class: 'pulse' }));
    }

    tbody.innerHTML = '';
    traces.forEach(tr => {
      const row = document.createElement('tr');
      if (Math.abs(smoothTime - tr.time) < 0.1) row.className = 'current';
      row.innerHTML = '<td>' + tr.time.toFixed(1) + '</td><td>' + tr.pos.toFixed(2) + '</td>';
      tbody.appendChild(row);
    });
  }

  // ===== 애니메이션 =====
  function addTrace(t) { traces.push({ time: t, pos: getPosition(t) }); }

  function start() {
    if (smoothTime >= maxTime) return;
    isPlaying = true;
    const startTimestamp = performance.now();
    const startSmooth = smoothTime;
    let lastTraceTime = Math.floor(smoothTime / traceInterval) * traceInterval;

    const animate = ts => {
      const elapsed = (ts - startTimestamp) / 1000;
      const t = startSmooth + elapsed * SPEED;
      if (t >= maxTime) {
        isPlaying = false;
        smoothTime = maxTime;
        if (Math.abs(lastTraceTime - maxTime) >= traceInterval * 0.99) addTrace(maxTime);
        rafId = null;
        render();
        return;
      }
      smoothTime = t;
      const cur = Math.floor(t / traceInterval) * traceInterval;
      if (cur > lastTraceTime && cur <= maxTime) {
        lastTraceTime = cur;
        addTrace(cur);
      }
      render();
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    render();
  }

  function pause() {
    isPlaying = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    render();
  }

  function reset() {
    pause();
    smoothTime = 0;
    traces = [{ time: 0, pos: 0 }];
    render();
  }

  // ===== 이벤트 =====
  playBtn.addEventListener('click', () => (isPlaying ? pause() : start()));
  resetBtn.addEventListener('click', reset);
  document.getElementById('intervalRow').addEventListener('click', e => {
    const b = e.target.closest('.int-btn');
    if (!b) return;
    traceInterval = parseFloat(b.dataset.interval);
    document.querySelectorAll('.int-btn').forEach(x => x.classList.toggle('active', x === b));
    reset();
  });

  render();
})();
</script>
</body>
</html>
