<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 2: 물체의 운동</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #134e4a 0%, #164e63 50%, #1e3a8a 100%);
    padding: 16px;
    color: #fff;
  }
  @media (min-width: 768px) { body { padding: 32px; } }
  .container { max-width: 1280px; margin: 0 auto; }
  .header { text-align: center; margin-bottom: 24px; }
  .header h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 8px; }
  @media (min-width: 768px) { .header h1 { font-size: 2.25rem; } }
  .header p { font-size: 1.125rem; color: #a5f3fc; }

  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }

  .mode-btn {
    padding: 12px 24px; border: none; border-radius: 12px; cursor: pointer;
    font-size: 1.125rem; font-weight: 700; color: #fff;
    background: rgba(255,255,255,.3); transition: all .2s;
  }
  .mode-btn:hover { background: rgba(255,255,255,.4); }
  .mode-btn.active { transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); }
  .mode-btn.active[data-mode="motion1"] { background: #ef4444; }
  .mode-btn.active[data-mode="motion2"] { background: #3b82f6; }
  .mode-btn.active[data-mode="both"] { background: #a855f7; }

  .interval-box {
    background: rgba(255,255,255,.2); backdrop-filter: blur(4px);
    border-radius: 12px; padding: 16px; max-width: 672px; margin: 0 auto 16px;
  }
  .interval-box h3 { text-align: center; font-weight: 700; margin-bottom: 12px; }
  .interval-box .row { margin-bottom: 0; }
  .int-btn {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; color: #1f2937; background: rgba(255,255,255,.5); transition: all .2s;
  }
  .int-btn:hover { background: rgba(255,255,255,.7); }
  .int-btn.active { background: #eab308; color: #fff; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); }

  .controls { margin-bottom: 24px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 32px; border: none; border-radius: 12px;
    color: #fff; font-size: 1.125rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
    transition: background .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 24px; height: 24px; }
  .btn-play { background: #22c55e; }
  .btn-play:hover { background: #16a34a; }
  .btn-play:disabled { background: #6b7280; cursor: not-allowed; }
  .btn-reset { background: #f97316; }
  .btn-reset:hover { background: #ea580c; }
  .timer-wrap { display: flex; justify-content: center; }
  .timer {
    min-width: 140px; padding: 16px 24px; text-align: center;
    font-size: 1.875rem; font-weight: 700;
    background: rgba(14, 116, 144, .8); border-radius: 12px;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
  }

  .view { max-width: 768px; margin: 0 auto; display: none; }
  .view.active { display: block; }
  .panel {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
  }
  @media (min-width: 768px) { .panel { padding: 24px; } }
  .panel h2 { color: #1f2937; font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
  @media (min-width: 768px) { .panel h2 { font-size: 1.5rem; margin-bottom: 16px; } }
  .svg-wrap { overflow-x: auto; }
  svg.graph { width: 100%; display: block; border: 4px solid #d1d5db; border-radius: 12px; }

  .legend { display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 24px; }
  .legend-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.2); backdrop-filter: blur(4px);
    border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: .875rem;
  }
  .legend-item .dot { width: 12px; height: 12px; border-radius: 50%; }
  .legend-1 { border: 1px solid #f87171; }
  .legend-2 { border: 1px solid #60a5fa; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

  .tick-text { font-size: 14px; fill: #374151; font-weight: 700; }
  .zero-text { font-size: 20px; fill: #111827; font-weight: 700; }
  .label-text { font-size: 18px; font-weight: 700; }
  .unit-text { font-size: 14px; fill: #4b5563; font-weight: 600; }
  .unit-text-lg { font-size: 16px; fill: #4b5563; font-weight: 600; }
  .home-link { position: fixed; top: 10px; left: 10px; z-index: 50; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; font-weight: 600; text-decoration: none; backdrop-filter: blur(4px); }
  .home-link:hover { background: rgba(0,0,0,.65); }
</style>
</head>
<body>
<a class="home-link" href="../index.html">← 활동 목록</a>
<div class="container">
  <div class="header">
    <h1>활동 2: 물체의 운동</h1>
    <p>두 물체의 운동을 비교해보세요</p>
  </div>

  <!-- 보기 모드 -->
  <div class="row" id="modeRow">
    <button class="mode-btn active" data-mode="motion1">운동 1만 보기</button>
    <button class="mode-btn" data-mode="motion2">운동 2만 보기</button>
    <button class="mode-btn" data-mode="both">둘 다 보기</button>
  </div>

  <!-- 자취 간격 -->
  <div class="interval-box">
    <h3>자취 시간 간격 설정</h3>
    <div class="row" id="intervalRow">
      <button class="int-btn" data-interval="0.2">0.2초</button>
      <button class="int-btn" data-interval="0.5">0.5초</button>
      <button class="int-btn active" data-interval="1">1초</button>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="playBtn" class="btn btn-play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
        <span id="playLabel">시작</span>
      </button>
      <button id="resetBtn" class="btn btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        다시하기
      </button>
    </div>
    <div class="timer-wrap"><div class="timer"><span id="timeDisplay">0.0초</span></div></div>
  </div>

  <!-- 운동 1만 -->
  <div class="view active" id="view-motion1">
    <div class="panel">
      <h2>운동 1 - DMTG</h2>
      <div class="svg-wrap"><svg class="graph" id="svg1" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>

  <!-- 운동 2만 -->
  <div class="view" id="view-motion2">
    <div class="panel">
      <h2>운동 2 - DMTG</h2>
      <div class="svg-wrap"><svg class="graph" id="svg2" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>

  <!-- 둘 다 -->
  <div class="view" id="view-both">
    <div class="panel">
      <h2>운동 비교 - DMTG</h2>
      <div class="svg-wrap"><svg class="graph" id="svgBoth" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg"></svg></div>
    </div>
  </div>

  <div class="legend">
    <div class="legend-item legend-1"><span class="dot" style="background:#ef4444"></span>운동 1</div>
    <div class="legend-item legend-2"><span class="dot" style="background:#3b82f6"></span>운동 2</div>
  </div>
</div>

<script>
(function () {
  // ===== 설정 =====
  const startPos = -2, endPos = 22;
  const maxTime = 5;  // 운동 2의 최고점 (v0/a = 5초)
  const SPEED = 2;    // 실제 1초당 시뮬레이션 2초 진행

  // 운동 1: 가속 (a = +1), x = 0.5·t²
  // 운동 2: 감속 (v0 = 5, a = -1), x = 5t - 0.5·t²
  const motions = [
    { pos: t => 0.5 * t * t,        color: '#ef4444', label: '1', labelColor: '#dc2626' },
    { pos: t => 5 * t - 0.5 * t * t, color: '#3b82f6', label: '2', labelColor: '#2563eb' },
  ];
  const toX = pos => 50 + ((pos - startPos) / (endPos - startPos)) * 600;

  // ===== 상태 =====
  let isPlaying = false;
  let smoothTime = 0;
  let traceInterval = 1;
  let viewMode = 'motion1';
  let traces = [[{ time: 0, pos: 0 }], [{ time: 0, pos: 0 }]];
  let rafId = null;

  // ===== DOM =====
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const playLabel = document.getElementById('playLabel');
  const resetBtn = document.getElementById('resetBtn');
  const timeDisplay = document.getElementById('timeDisplay');

  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function drawAxis(svg, y) {
    svg.appendChild(el('line', { x1: 50, y1: y, x2: 650, y2: y, stroke: '#374151', 'stroke-width': 5 }));
    for (let v = Math.ceil(startPos); v <= endPos; v++) {
      if (v === 0) continue;
      const x = toX(v);
      svg.appendChild(el('line', { x1: x, y1: y - 10, x2: x, y2: y + 10, stroke: '#374151', 'stroke-width': 2 }));
      svg.appendChild(el('text', { x, y: y + 30, 'text-anchor': 'middle', class: 'tick-text' }, v));
    }
    if (startPos <= 0 && endPos >= 0) {
      const x0 = toX(0);
      svg.appendChild(el('line', { x1: x0, y1: y - 15, x2: x0, y2: y + 15, stroke: '#374151', 'stroke-width': 5 }));
      svg.appendChild(el('text', { x: x0, y: y + 50, 'text-anchor': 'middle', class: 'zero-text' }, '0'));
    }
  }
  function makeGroup(svg) { const g = el('g', {}); svg.appendChild(g); return g; }

  // 단일 그래프 (운동 1만 / 운동 2만)
  const singleGroups = [0, 1].map(i => {
    const svg = document.getElementById(i === 0 ? 'svg1' : 'svg2');
    drawAxis(svg, 150);
    svg.appendChild(el('text', { x: 25, y: 155, 'text-anchor': 'middle', class: 'label-text', fill: '#374151' }, motions[i].label));
    svg.appendChild(el('text', { x: 350, y: 230, 'text-anchor': 'middle', class: 'unit-text' }, '위치 (m)'));
    return makeGroup(svg);
  });

  // 비교 그래프 (둘 다)
  const svgBoth = document.getElementById('svgBoth');
  const bothY = [120, 380];
  drawAxis(svgBoth, bothY[0]);
  drawAxis(svgBoth, bothY[1]);
  svgBoth.appendChild(el('text', { x: 25, y: 125, 'text-anchor': 'middle', class: 'label-text', fill: motions[0].labelColor }, '1'));
  svgBoth.appendChild(el('text', { x: 25, y: 385, 'text-anchor': 'middle', class: 'label-text', fill: motions[1].labelColor }, '2'));
  svgBoth.appendChild(el('text', { x: 350, y: 50, 'text-anchor': 'middle', class: 'unit-text-lg' }, '운동 1 - 위치 (m)'));
  svgBoth.appendChild(el('text', { x: 350, y: 470, 'text-anchor': 'middle', class: 'unit-text-lg' }, '운동 2 - 위치 (m)'));
  const bothGroups = [makeGroup(svgBoth), makeGroup(svgBoth)];

  // ===== 렌더링 =====
  function renderGroup(g, i, y) {
    const m = motions[i];
    while (g.firstChild) g.removeChild(g.firstChild);
    traces[i].forEach(tr => {
      const x = toX(tr.pos);
      if (x < 50 || x > 650) return;
      g.appendChild(el('circle', { cx: x, cy: y, r: 7, fill: m.color, opacity: 0.7 }));
    });
    const cur = m.pos(smoothTime);
    if (cur >= startPos && cur <= endPos) {
      g.appendChild(el('circle', { cx: toX(cur), cy: y, r: 14, fill: m.color, class: 'pulse' }));
    }
  }

  function render() {
    timeDisplay.textContent = smoothTime.toFixed(1) + '초';
    playBtn.disabled = smoothTime >= maxTime;
    playIcon.style.display = isPlaying ? 'none' : '';
    pauseIcon.style.display = isPlaying ? '' : 'none';
    playLabel.textContent = isPlaying ? '일시정지' : '시작';
    for (let i = 0; i < 2; i++) {
      renderGroup(singleGroups[i], i, 150);
      renderGroup(bothGroups[i], i, bothY[i]);
    }
  }

  function setViewMode(mode) {
    viewMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + mode));
  }

  // ===== 애니메이션 =====
  function addTrace(t) {
    for (let i = 0; i < 2; i++) traces[i].push({ time: t, pos: motions[i].pos(t) });
  }

  function start() {
    if (smoothTime >= maxTime) return;
    isPlaying = true;
    const startTimestamp = performance.now();
    const startSmooth = smoothTime;
    let lastTraceTime = Math.floor(smoothTime / traceInterval) * traceInterval;

    const animate = ts => {
      const elapsed = (ts - startTimestamp) / 1000;
      const t = startSmooth + elapsed * SPEED;
      if (t >= maxTime) {
        isPlaying = false;
        smoothTime = maxTime;
        if (Math.abs(lastTraceTime - maxTime) >= traceInterval * 0.99) addTrace(maxTime);
        rafId = null;
        render();
        return;
      }
      smoothTime = t;
      const cur = Math.floor(t / traceInterval) * traceInterval;
      if (cur > lastTraceTime && cur <= maxTime) {
        lastTraceTime = cur;
        addTrace(cur);
      }
      render();
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    render();
  }

  function pause() {
    isPlaying = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    render();
  }

  function reset() {
    pause();
    smoothTime = 0;
    traces = [[{ time: 0, pos: 0 }], [{ time: 0, pos: 0 }]];
    render();
  }

  // ===== 이벤트 =====
  playBtn.addEventListener('click', () => (isPlaying ? pause() : start()));
  resetBtn.addEventListener('click', reset);
  document.getElementById('modeRow').addEventListener('click', e => {
    const b = e.target.closest('.mode-btn');
    if (b) setViewMode(b.dataset.mode);
  });
  document.getElementById('intervalRow').addEventListener('click', e => {
    const b = e.target.closest('.int-btn');
    if (!b) return;
    traceInterval = parseFloat(b.dataset.interval);
    document.querySelectorAll('.int-btn').forEach(x => x.classList.toggle('active', x === b));
    reset();
  });

  render();
})();
</script>
</body>
</html>
