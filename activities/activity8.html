<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>활동 8: 두 운동 비교하기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3a8a 0%, #581c87 50%, #831843 100%);
    padding: 16px; color: #fff;
  }
  @media (min-width: 768px) { body { padding: 32px; } }
  .container { max-width: 1280px; margin: 0 auto; }

  .header { position: relative; margin-bottom: 24px; text-align: center; padding-top: 8px; }
  .header h1 { font-size: 1.875rem; font-weight: 700; margin-bottom: 8px; }
  @media (min-width: 768px) { .header h1 { font-size: 2.25rem; } }
  .header p { font-size: 1.125rem; opacity: .9; }
  .layout-btn {
    position: absolute; top: 0; right: 0; z-index: 10;
    padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer;
    font-size: 1.125rem; font-weight: 700; background: #fff; color: #1f2937;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); transition: all .2s;
  }
  .layout-btn:hover { background: #f3f4f6; }
  .layout-btn.desktop { background: #a855f7; color: #fff; }
  .layout-btn.desktop:hover { background: #9333ea; }

  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .glass {
    background: rgba(255,255,255,.2); backdrop-filter: blur(4px);
    border-radius: 12px; padding: 16px;
  }
  .interval-box { max-width: 672px; margin: 0 auto 16px; }
  .interval-box h3, .range-box h3 { text-align: center; font-weight: 700; margin-bottom: 12px; }
  .int-btn {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; color: #1f2937; background: rgba(255,255,255,.5); transition: all .2s;
  }
  .int-btn:hover { background: rgba(255,255,255,.7); }
  .int-btn.active { background: #eab308; color: #fff; transform: scale(1.05); box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); }
  .divider { width: 1px; height: 32px; background: rgba(255,255,255,.4); }
  .toggle-btn {
    padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer;
    font-weight: 600; background: #9ca3af; color: #374151; transition: all .2s;
  }
  .toggle-btn.active { background: #3b82f6; color: #fff; box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); }

  .controls { margin-bottom: 24px; }
  .buttons { display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 16px 32px; border: none; border-radius: 12px;
    color: #fff; font-size: 1.125rem; font-weight: 700; cursor: pointer;
    box-shadow: 0 10px 15px -3px rgba(0,0,0,.3); transition: background .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 24px; height: 24px; }
  .btn-play { background: #22c55e; }
  .btn-play:hover { background: #16a34a; }
  .btn-play:disabled { background: #6b7280; cursor: not-allowed; }
  .btn-reset { background: #f97316; }
  .btn-reset:hover { background: #ea580c; }
  .timer-wrap { display: flex; justify-content: center; }
  .timer {
    min-width: 140px; padding: 16px 24px; text-align: center; font-size: 1.875rem; font-weight: 700;
    background: rgba(29, 78, 216, .8); border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0,0,0,.3);
  }

  /* 레이아웃 */
  .layout { display: flex; flex-direction: column; gap: 24px; }
  .graphs { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .layout.desktop .graphs { grid-template-columns: 1fr 1fr; }

  .panel {
    background: #fff; border-radius: 16px; padding: 16px; color: #1f2937;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.4);
  }
  @media (min-width: 768px) { .panel { padding: 24px; } }
  .panel h2 { font-size: 1.25rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
  @media (min-width: 768px) { .panel h2 { font-size: 1.5rem; margin-bottom: 16px; } }
  .panel .hint { text-align: center; color: #4b5563; font-size: .875rem; margin-bottom: 12px; }
  .svg-wrap { overflow-x: auto; }
  .svg-wrap svg { width: 100%; display: block; border: 4px solid #d1d5db; border-radius: 12px; touch-action: none; user-select: none; }
  .legend { margin-top: 16px; display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: .875rem; font-weight: 600; }
  .legend-item .dot { width: 16px; height: 16px; border-radius: 50%; }

  /* 표 */
  .table-card { background: #fff; border-radius: 12px; padding: 16px; color: #1f2937; box-shadow: 0 25px 50px -12px rgba(0,0,0,.4); }
  .table-card h3 { font-size: 1.125rem; font-weight: 700; text-align: center; margin-bottom: 12px; }
  .table-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .table-grid h4 { font-size: .875rem; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .table-grid h4 .dot { width: 12px; height: 12px; border-radius: 50%; }
  .table-scroll { overflow-y: auto; max-height: 320px; }
  table { width: 100%; font-size: .875rem; border-collapse: collapse; }
  th, td { padding: 4px 8px; text-align: center; }
  thead th { position: sticky; top: 0; font-weight: 700; }
  .t1 thead th { background: #fee2e2; border: 1px solid #fca5a5; }
  .t1 td { border: 1px solid #fecaca; }
  .t1 tbody tr:hover { background: #fef2f2; }
  .t1 tbody tr.current { background: #fecaca; font-weight: 700; }
  .t2 thead th { background: #dbeafe; border: 1px solid #93c5fd; }
  .t2 td { border: 1px solid #bfdbfe; }
  .t2 tbody tr:hover { background: #eff6ff; }
  .t2 tbody tr.current { background: #bfdbfe; font-weight: 700; }

  /* 운동 정보 / 범위 설정 */
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 24px 0; }
  .info-card .title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1.125rem; margin-bottom: 8px; }
  .info-card .title .dot { width: 16px; height: 16px; border-radius: 50%; }
  .range-box { max-width: 672px; margin: 0 auto; }
  .range-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .range-grid label { display: block; font-size: .875rem; margin-bottom: 4px; }
  .range-grid input { width: 100%; padding: 8px 12px; border-radius: 8px; border: none; font-size: 1rem; color: #1f2937; }
  .note { margin-top: 24px; background: rgba(30, 58, 138, .5); border-radius: 12px; padding: 16px; text-align: center; font-size: .875rem; }

  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  .pulse { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }

  .tick { font-size: 14px; fill: #374151; font-weight: 600; }
  .tick-xs { font-size: 12px; fill: #4b5563; }
  .tick-zero { font-size: 18px; fill: #111827; font-weight: 700; }
  .tick-zero-sm { font-size: 14px; fill: #111827; font-weight: 700; }
  .label { font-size: 16px; font-weight: 700; }
  .axis-label { font-size: 14px; fill: #4b5563; font-weight: 600; }
  .grab { cursor: grab; }
  .grabbing { cursor: grabbing; }
  .home-link { position: fixed; top: 10px; left: 10px; z-index: 50; padding: 6px 12px; border-radius: 8px;
    background: rgba(0,0,0,.45); color: #fff; font-size: .8rem; font-weight: 600; text-decoration: none; backdrop-filter: blur(4px); }
  .home-link:hover { background: rgba(0,0,0,.65); }
</style>
</head>
<body>
<a class="home-link" href="../index.html">← 활동 목록</a>
<div class="container">
  <div class="header">
    <button id="layoutBtn" class="layout-btn">💻 데스크탑</button>
    <h1>활동 8: 두 운동 비교하기</h1>
    <p>두 등속 운동의 자취와 그래프를 비교해보세요</p>
  </div>

  <div class="glass interval-box">
    <h3>자취 시간 간격 설정</h3>
    <div class="row">
      <button class="int-btn" data-interval="0.2">0.2초</button>
      <button class="int-btn" data-interval="0.5">0.5초</button>
      <button class="int-btn active" data-interval="1">1초</button>
      <div class="divider"></div>
      <button id="traceToggle" class="toggle-btn active">자취 숨기기</button>
    </div>
  </div>

  <div class="controls">
    <div class="buttons">
      <button id="playBtn" class="btn btn-play">
        <svg id="playIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><rect x="14" y="4" width="4" height="16" rx="1"></rect><rect x="6" y="4" width="4" height="16" rx="1"></rect></svg>
        <span id="playLabel">시작</span>
      </button>
      <button id="resetBtn" class="btn btn-reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
        다시하기
      </button>
    </div>
    <div class="timer-wrap"><div class="timer"><span id="timeDisplay">0.0초</span></div></div>
  </div>

  <div class="layout" id="layout">
    <div class="graphs">
      <div class="panel">
        <h2>동적 자취</h2>
        <div class="svg-wrap"><svg id="svgTrace" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="legend">
          <div class="legend-item"><span class="dot" style="background:#ef4444"></span>운동 1</div>
          <div class="legend-item"><span class="dot" style="background:#3b82f6"></span>운동 2</div>
        </div>
      </div>
      <div class="panel">
        <h2>위치-시간 그래프</h2>
        <p class="hint">빨간색/파란색 점을 드래그하여 운동을 조절하세요</p>
        <div class="svg-wrap"><svg id="svgPos" viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg"></svg></div>
      </div>
    </div>
    <div class="table-card">
      <h3>시간과 위치 데이터</h3>
      <div class="table-grid">
        <div>
          <h4><span class="dot" style="background:#ef4444"></span>운동 1</h4>
          <div class="table-scroll"><table class="t1"><thead><tr><th>시간 (초)</th><th>위치 (m)</th></tr></thead><tbody id="tbody1"></tbody></table></div>
        </div>
        <div>
          <h4><span class="dot" style="background:#3b82f6"></span>운동 2</h4>
          <div class="table-scroll"><table class="t2"><thead><tr><th>시간 (초)</th><th>위치 (m)</th></tr></thead><tbody id="tbody2"></tbody></table></div>
        </div>
      </div>
    </div>
  </div>

  <div class="info-grid">
    <div class="glass info-card">
      <div class="title"><span class="dot" style="background:#ef4444"></span>운동 1</div>
      <div id="info1"></div>
    </div>
    <div class="glass info-card">
      <div class="title"><span class="dot" style="background:#3b82f6"></span>운동 2</div>
      <div id="info2"></div>
    </div>
  </div>

  <div class="glass range-box">
    <h3>그래프 범위 설정</h3>
    <div class="range-grid">
      <div><label>위치 최소 (m)</label><input type="number" id="inStart" value="-5"></div>
      <div><label>위치 최대 (m)</label><input type="number" id="inEnd" value="15"></div>
      <div><label>최대 시간 (초)</label><input type="number" id="inMaxTime" min="1" max="20" value="10"></div>
    </div>
  </div>

  <div class="note">💡 <strong>사용법:</strong> 위치-시간 그래프에서 빨간색/파란색 점을 드래그하여 운동의 시작 위치와 끝 위치를 조절하세요!</div>
</div>

<script>
(function () {
  const SPEED = 2; // 실제 1초당 시뮬레이션 2초

  // ===== 상태 =====
  let startPos = -5, endPos = 15, maxTime = 10;
  const motions = [
    { start: 0, end: 10, color: '#ef4444', labelColor: '#dc2626' },
    { start: 4, end: 4,  color: '#3b82f6', labelColor: '#2563eb' },
  ];
  let isPlaying = false, showTraces = true, desktop = false;
  let smoothTime = 0, time = 0, traceInterval = 1, rafId = null;
  let traces = motions.map(m => [{ time: 0, pos: m.start }]);
  let dragging = null; // { motion, point }

  const getPosition = (i, t) => motions[i].start + ((motions[i].end - motions[i].start) / maxTime) * t;

  // ===== DOM =====
  const $ = id => document.getElementById(id);
  const svgTrace = $('svgTrace'), svgPos = $('svgPos');
  const tbodies = [$('tbody1'), $('tbody2')];
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }

  // ===== 동적 자취 =====
  function renderTrace() {
    const toX = p => 50 + ((p - startPos) / (endPos - startPos)) * 600;
    clear(svgTrace);
    svgTrace.appendChild(el('line', { x1: 50, y1: 150, x2: 650, y2: 150, stroke: '#374151', 'stroke-width': 5 }));
    for (let v = Math.ceil(startPos); v <= endPos; v++) {
      if (v === 0) continue;
      const x = toX(v);
      svgTrace.appendChild(el('line', { x1: x, y1: 140, x2: x, y2: 160, stroke: '#374151', 'stroke-width': 2 }));
      svgTrace.appendChild(el('text', { x, y: 180, 'text-anchor': 'middle', class: 'tick' }, v));
    }
    if (startPos <= 0 && endPos >= 0) {
      const x0 = toX(0);
      svgTrace.appendChild(el('line', { x1: x0, y1: 130, x2: x0, y2: 170, stroke: '#374151', 'stroke-width': 4 }));
      svgTrace.appendChild(el('text', { x: x0, y: 200, 'text-anchor': 'middle', class: 'tick-zero' }, '0'));
    }
    const ys = [100, 200];
    motions.forEach((m, i) => {
      if (showTraces) traces[i].forEach(tr => svgTrace.appendChild(el('circle', { cx: toX(tr.pos), cy: ys[i], r: 6, fill: m.color, opacity: 0.7 })));
      svgTrace.appendChild(el('circle', { cx: toX(getPosition(i, smoothTime)), cy: ys[i], r: 12, fill: m.color, class: 'pulse' }));
      svgTrace.appendChild(el('text', { x: 25, y: ys[i] + 5, 'text-anchor': 'middle', class: 'label', fill: m.labelColor }, i + 1));
    });
    svgTrace.appendChild(el('text', { x: 350, y: 230, 'text-anchor': 'middle', class: 'axis-label' }, '위치 (m)'));
  }

  // ===== 위치-시간 그래프 =====
  const GH = 270, GB = 300;
  const pY = p => GB - ((p - startPos) / (endPos - startPos)) * GH;
  const tX = t => 50 + t * (600 / maxTime);

  function renderPos() {
    clear(svgPos);
    for (let v = Math.ceil(startPos / 2) * 2; v <= endPos; v += 2) {
      const y = pY(v), z = v === 0;
      svgPos.appendChild(el('line', { x1: 50, y1: y, x2: 650, y2: y, stroke: '#e5e7eb', 'stroke-width': 1 }));
      svgPos.appendChild(el('line', { x1: 45, y1: y, x2: 55, y2: y, stroke: '#374151', 'stroke-width': z ? 3 : 2 }));
      svgPos.appendChild(el('text', { x: 35, y: y + 5, 'text-anchor': 'end', class: z ? 'tick-zero-sm' : 'tick-xs' }, v));
    }
    for (let t = 0; t <= maxTime; t++) {
      const x = tX(t), z = t === 0;
      svgPos.appendChild(el('line', { x1: x, y1: 30, x2: x, y2: GB, stroke: '#e5e7eb', 'stroke-width': 1 }));
      svgPos.appendChild(el('line', { x1: x, y1: GB - 5, x2: x, y2: GB + 5, stroke: '#374151', 'stroke-width': z ? 3 : 2 }));
      svgPos.appendChild(el('text', { x, y: GB + 20, 'text-anchor': 'middle', class: z ? 'tick-zero-sm' : 'tick-xs' }, t));
    }
    const zeroY = pY(0);
    svgPos.appendChild(el('line', { x1: 50, y1: zeroY, x2: 650, y2: zeroY, stroke: '#374151', 'stroke-width': 3 }));
    svgPos.appendChild(el('line', { x1: 50, y1: 30, x2: 50, y2: GB, stroke: '#374151', 'stroke-width': 3 }));
    svgPos.appendChild(el('circle', { cx: 50, cy: zeroY, r: 4, fill: '#374151' }));

    motions.forEach((m, i) => {
      svgPos.appendChild(el('line', { x1: 50, y1: pY(m.start), x2: 650, y2: pY(m.end), stroke: m.color, 'stroke-width': 3, opacity: 0.5 }));
      if (showTraces) traces[i].forEach(tr => svgPos.appendChild(el('circle', { cx: tX(tr.time), cy: pY(tr.pos), r: 5, fill: m.color })));
    });
    // 드래그 포인트
    motions.forEach((m, i) => {
      [['start', 50, m.start], ['end', 650, m.end]].forEach(([pt, cx, val]) => {
        const active = dragging && dragging.motion === i && dragging.point === pt;
        const g = el('g', { class: isPlaying ? '' : (active ? 'grabbing' : 'grab') });
        g.appendChild(el('circle', { cx, cy: pY(val), r: 30, fill: 'transparent' }));
        g.appendChild(el('circle', { cx, cy: pY(val), r: 15, fill: m.color, stroke: '#fff', 'stroke-width': 4, opacity: active ? 0.7 : 1, 'pointer-events': 'none' }));
        g.addEventListener('pointerdown', e => onDragStart(e, i, pt));
        svgPos.appendChild(g);
      });
    });
    motions.forEach((m, i) => svgPos.appendChild(el('circle', { cx: tX(smoothTime), cy: pY(getPosition(i, smoothTime)), r: 10, fill: m.color, class: 'pulse' })));
    svgPos.appendChild(el('text', { x: 375, y: 340, 'text-anchor': 'middle', class: 'axis-label' }, '시간 (초)'));
    svgPos.appendChild(el('text', { x: 15, y: 175, 'text-anchor': 'middle', class: 'axis-label', transform: 'rotate(-90 15 175)' }, '위치 (m)'));
  }

  // ===== 표 / 기타 =====
  function renderTables() {
    tbodies.forEach((tb, i) => {
      tb.innerHTML = '';
      traces[i].forEach(tr => {
        const row = document.createElement('tr');
        if (time === tr.time) row.className = 'current';
        row.innerHTML = '<td>' + tr.time + '</td><td>' + tr.pos.toFixed(2) + '</td>';
        tb.appendChild(row);
      });
    });
  }
  function renderMisc() {
    $('timeDisplay').textContent = smoothTime.toFixed(1) + '초';
    $('playBtn').disabled = time >= maxTime;
    $('playIcon').style.display = isPlaying ? 'none' : '';
    $('pauseIcon').style.display = isPlaying ? '' : 'none';
    $('playLabel').textContent = isPlaying ? '일시정지' : '시작';
    const tt = $('traceToggle');
    tt.textContent = showTraces ? '자취 숨기기' : '자취 보이기';
    tt.classList.toggle('active', showTraces);
    $('info1').textContent = '시작: ' + motions[0].start.toFixed(1) + 'm → 끝: ' + motions[0].end.toFixed(1) + 'm';
    $('info2').textContent = '시작: ' + motions[1].start.toFixed(1) + 'm → 끝: ' + motions[1].end.toFixed(1) + 'm';
  }
  function render() { renderMisc(); renderTrace(); renderPos(); renderTables(); }

  // ===== 드래그 =====
  function onDragStart(e, motion, point) {
    if (isPlaying) return;
    e.preventDefault(); e.stopPropagation();
    dragging = { motion, point };
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
    render();
  }
  function onDragMove(e) {
    if (!dragging) return;
    e.preventDefault();
    const rect = svgPos.getBoundingClientRect();
    const mouseY = (e.clientY - rect.top) * (350 / rect.height);
    const newPos = Math.max(startPos, Math.min(endPos, startPos + ((GB - mouseY) / GH) * (endPos - startPos)));
    motions[dragging.motion][dragging.point] = newPos;
    reset();
  }
  function onDragEnd() {
    dragging = null;
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragEnd);
    window.removeEventListener('pointercancel', onDragEnd);
    render();
  }

  // ===== 애니메이션 =====
  function addTrace(t) { motions.forEach((m, i) => traces[i].push({ time: t, pos: getPosition(i, t) })); }
  function start() {
    if (time >= maxTime) return;
    isPlaying = true;
    const startTimestamp = performance.now(), startSmooth = smoothTime;
    let lastTraceTime = Math.floor(smoothTime / traceInterval) * traceInterval;
    const animate = ts => {
      const t = startSmooth + ((ts - startTimestamp) / 1000) * SPEED;
      if (t >= maxTime) {
        isPlaying = false; smoothTime = maxTime; time = maxTime;
        if (Math.abs(lastTraceTime - maxTime) >= traceInterval * 0.99) addTrace(maxTime);
        rafId = null; render(); return;
      }
      smoothTime = t;
      const cur = Math.floor(t / traceInterval) * traceInterval;
      if (cur > lastTraceTime && cur <= maxTime) { lastTraceTime = cur; time = cur; addTrace(cur); }
      render();
      rafId = requestAnimationFrame(animate);
    };
    rafId = requestAnimationFrame(animate);
    render();
  }
  function pause() {
    isPlaying = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    render();
  }
  function reset() {
    isPlaying = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    smoothTime = 0; time = 0;
    traces = motions.map(m => [{ time: 0, pos: m.start }]);
    render();
  }

  // ===== 이벤트 =====
  $('playBtn').addEventListener('click', () => (isPlaying ? pause() : start()));
  $('resetBtn').addEventListener('click', reset);
  document.querySelectorAll('.int-btn').forEach(b => b.addEventListener('click', () => {
    traceInterval = parseFloat(b.dataset.interval);
    document.querySelectorAll('.int-btn').forEach(x => x.classList.toggle('active', x === b));
    reset();
  }));
  $('traceToggle').addEventListener('click', () => { showTraces = !showTraces; render(); });
  $('layoutBtn').addEventListener('click', () => {
    desktop = !desktop;
    $('layout').classList.toggle('desktop', desktop);
    const b = $('layoutBtn');
    b.textContent = desktop ? '📱 모바일' : '💻 데스크탑';
    b.classList.toggle('desktop', desktop);
  });
  $('inStart').addEventListener('input', e => { const v = Number(e.target.value); if (!isNaN(v) && v < endPos) { startPos = v; render(); } });
  $('inEnd').addEventListener('input', e => { const v = Number(e.target.value); if (!isNaN(v) && v > startPos) { endPos = v; render(); } });
  $('inMaxTime').addEventListener('input', e => { const v = Number(e.target.value); if (v >= 1 && v <= 20) { maxTime = v; reset(); } });

  render();
})();
</script>
</body>
</html>
